name: Windows smoke test

# Manual only (workflow_dispatch), not a per-commit gate -- a cross-platform
# build/test sanity check meant to be run by hand from the Actions tab (or
# `gh workflow run windows-smoke-test.yml`) before a release, not on every
# commit.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to test"
        required: false
        default: "develop"

jobs:
  windows-build-and-test:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # pandas is used throughout paper_results/ but isn't pinned in
          # requirements.txt (it's present some other way in the dev conda
          # env) -- installed explicitly here so a clean CI install works.
          pip install pandas

      - name: Build Cython/C++ extensions
        run: python setup.py build_ext --inplace

      - name: Run full test suite
        run: python test_all.py

      - name: Regenerate experimental results and diff against the macOS reference
        run: |
          cp paper_results/results/experimental_results.csv "$RUNNER_TEMP/macos_reference.csv"
          python paper_results/evaluate/evaluate_experimental.py
          python .github/workflows/diff_experimental_results.py \
            "$RUNNER_TEMP/macos_reference.csv" paper_results/results/experimental_results.csv

      - name: Diagnostic - regenerate with cv2 optimizations (incl. IPP) disabled and diff
        if: always()
        run: |
          cp paper_results/results/experimental_results.csv "$RUNNER_TEMP/windows_ipp_enabled.csv"
          OPENDROP_DISABLE_CV2_OPTIMIZATION=1 python paper_results/evaluate/evaluate_experimental.py
          cp paper_results/results/experimental_results.csv "$RUNNER_TEMP/windows_ipp_disabled.csv"
          echo "--- Diff vs macOS reference, cv2 optimizations disabled ---"
          python .github/workflows/diff_experimental_results.py \
            "$RUNNER_TEMP/macos_reference.csv" "$RUNNER_TEMP/windows_ipp_disabled.csv" || true
          cp "$RUNNER_TEMP/windows_ipp_enabled.csv" paper_results/results/experimental_results_ipp_enabled.csv
          cp "$RUNNER_TEMP/windows_ipp_disabled.csv" paper_results/results/experimental_results_ipp_disabled.csv

      - name: Upload regenerated results as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-experimental-results
          path: |
            paper_results/results/experimental_results.csv
            paper_results/results/experimental_results_ipp_enabled.csv
            paper_results/results/experimental_results_ipp_disabled.csv
